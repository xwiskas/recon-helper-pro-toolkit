name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        # The suite uses recorded/mocked responses only; it must pass with no
        # network access and with no optional external tools installed.
        run: python -m pytest -q

      - name: Check the CLI starts with no external binaries
        run: |
          python -m recon_helper_pro.cli.main version
          python -m recon_helper_pro.cli.main modules

      - name: Check the dashboard app builds
        run: |
          python -c "from recon_helper_pro.web.server import create_app; print('dashboard ok')"
